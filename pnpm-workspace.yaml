allowBuilds:
  '@sentry/cli': false
  sharp: true
  unrs-resolver: false
onlyBuiltDependencies:
  - sharp

# eslint 툴체인 내부 전이 의존성의 알려진 취약점 패치 — 분기별 의존성 감사(§DEPENDENCY_AUDIT.md)로 발견.
# 이 2개는 개발용 빌드 도구 내부 leaf 패키지라 강제로 올려도 런타임/빌드 결과에 영향이 없다.
# brace-expansion은 여기 포함하지 않는다 — 트리에 v1(minimatch@3)과 v5(minimatch@10)가
# 공존해 override로 강제 승급하면 v1 API를 기대하는 소비자가 깨진다(ESLint 크래시로 발견,
# §DEPENDENCY_AUDIT.md 2026-08-15 후속 기록).
overrides:
  js-yaml: '>=4.3.1'
  nanoid: '>=3.3.18'
